apiVersion: apps/v1
kind: Deployment
metadata:
  name: chromadb
  namespace: dev
  labels:
    app: chromadb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chromadb
  template:
    metadata:
      labels:
        app: chromadb
    spec:
      containers:
      - name: chromadb
        image: localhost:5000/chromadb:latest
        ports:
          - containerPort: 8000
        env:
          - name: CHROMA_AUTH_CREDENTIALS
            valueFrom:
              secretKeyRef:
                name: env-config
                key: CHROMA_AUTH_CREDENTIALS
          - name: CHROMA_AUTH_PROVIDER
            value: "chromadb.auth.basic.BasicAuthServerProvider"
        volumeMounts:
          - name: chroma-storage
            mountPath: /chroma/chroma
        livenessProbe:
          httpGet:
            path: /api/v2/heartbeat
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v2/heartbeat
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
        - name: chroma-storage
          persistentVolumeClaim:
            claimName: chromadb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: chromadb
  namespace: dev
spec:
  selector:
    app: chromadb
  ports:
    - port: 8000
      targetPort: 8000
  type: NodePort
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chromadb-pvc
  namespace: dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chromadb
  namespace: dev
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: chromadb.dev.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chromadb
                port:
                  number: 8000
